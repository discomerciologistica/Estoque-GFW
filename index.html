<style>
  :root {
    --bg: #14161a;
    --bg-panel: #1c1f25;
    --bg-elevated: #23272f;
    --border: #2e333d;
    --text: #e8eaed;
    --text-dim: #9aa1ac;
    --accent: #4f8cff;
    --accent-dim: #2c4a80;
    --green: #3ecf8e;
    --red: #f0655a;
    --amber: #e0a83e;
    --radius: 10px;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); }
